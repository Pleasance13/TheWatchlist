name: Deploy preview to GitHub Pages

on:
  push:
    branches:
      - list-mode-improvement
      - feature/tmdb-integration
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Bust browser cache
        run: |
          sed -i "s|styles.css|styles.css?v=${GITHUB_SHA}|g; s|app.js|app.js?v=${GITHUB_SHA}|g" index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
